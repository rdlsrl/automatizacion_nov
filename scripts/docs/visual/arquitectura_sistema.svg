<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <style>
      .title{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#003366}
      .label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#333333}
      .small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#555555}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1.5;rx:14;ry:14;filter:url(#shadow)}
      .group{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1}
      .arrow{stroke:#6b7280;stroke-width:1.5;marker-end:url(#arrow)}
      .pill{fill:#ecfeff;stroke:#a5f3fc;stroke-width:1}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="48" class="title">Estructura general del sistema — Sistema de Gestión Funeraria</text>

  <!-- Usuarios -->
  <rect x="40" y="90" width="240" height="420" class="group"/>
  <text x="50" y="112" class="small">Usuarios</text>
  <rect x="60" y="140" width="200" height="70" class="card"/>
  <text x="80" y="175" class="label">Dueño</text>
  <rect x="60" y="230" width="200" height="70" class="card"/>
  <text x="80" y="265" class="label">Administración</text>
  <rect x="60" y="320" width="200" height="70" class="card"/>
  <text x="85" y="355" class="label">Secretarías</text>
  <rect x="60" y="410" width="200" height="70" class="card"/>
  <text x="95" y="445" class="label">Choferes</text>

  <!-- App Web -->
  <rect x="340" y="150" width="260" height="140" class="card"/>
  <text x="360" y="185" class="label">Sistema Web</text>
  <text x="360" y="205" class="small">Contratos, Inventario, RR.HH., Panel</text>
  <rect x="360" y="215" width="220" height="28" class="pill"/>
  <text x="370" y="235" class="small">Autenticación y permisos por rol</text>

  <!-- API/Servicios -->
  <rect x="660" y="150" width="240" height="140" class="card"/>
  <text x="680" y="185" class="label">Procesos internos y automatización</text>
  <text x="680" y="205" class="small">Control de procesos y trazabilidad</text>

  <!-- Datos -->
  <rect x="960" y="90" width="280" height="420" class="group"/>
  <text x="970" y="112" class="small">Datos y Salidas</text>
  <rect x="980" y="140" width="240" height="80" class="card"/>
  <text x="1000" y="175" class="label">Base de datos y reportes</text>
  <text x="1000" y="195" class="small">Contratos, clientes, empleados…</text>

  <rect x="980" y="240" width="240" height="70" class="card"/>
  <text x="1000" y="275" class="label">Gestión de archivos</text>
  <text x="1000" y="295" class="small">Adjuntos y respaldos</text>

  <rect x="980" y="330" width="240" height="70" class="card"/>
  <text x="1000" y="365" class="label">Comunicaciones automáticas</text>
  <text x="1000" y="385" class="small">WhatsApp/Email programados</text>

  <rect x="980" y="420" width="240" height="70" class="card"/>
  <text x="1000" y="455" class="label">Contabilidad y finanzas integradas</text>
  <text x="1000" y="475" class="small">Export bancario/ERP</text>

  <!-- Flechas -->
  <line x1="280" y1="175" x2="340" y2="200" class="arrow"/>
  <line x1="280" y1="265" x2="340" y2="220" class="arrow"/>
  <line x1="280" y1="355" x2="340" y2="245" class="arrow"/>
  <line x1="280" y1="445" x2="340" y2="260" class="arrow"/>

  <line x1="600" y1="220" x2="660" y2="220" class="arrow"/>
  <line x1="900" y1="220" x2="980" y2="180" class="arrow"/>

  <line x1="900" y1="220" x2="980" y2="275" class="arrow"/>
  <line x1="900" y1="220" x2="980" y2="365" class="arrow"/>
  <line x1="900" y1="220" x2="980" y2="455" class="arrow"/>
</svg>